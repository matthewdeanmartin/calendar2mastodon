---
name: Calendar Reminder
on:
  schedule:
    - cron: "30 11 * * *" # 6:30am EST (UTC-5, Nov–Mar)
    - cron: "30 10 * * *" # 6:30am EDT (UTC-4, Mar–Nov)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: hynek/setup-cached-uv@34e35d30f1ebc7421a5cc733bca38dcc62603960 # v2.6.0

      - name: Restore reminder state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/calendar2mastodon
          key: reminder-state-${{ runner.os }}

      - name: Install (no dev deps)
        run: uv sync --no-dev

      - name: Run reminders
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
          MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: uv run calendar2mastodon

      - name: Save reminder state
        if: always()
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/calendar2mastodon
          key: reminder-state-${{ runner.os }}
